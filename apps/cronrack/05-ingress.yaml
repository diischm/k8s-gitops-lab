apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cronrack
  namespace: cronrack
spec:
  ingressClassName: traefik
  rules:
    - host: cronrack.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cronrack-web
                port:
                  name: http
