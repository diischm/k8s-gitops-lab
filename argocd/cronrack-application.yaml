apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cronrack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/diischm/k8s-gitops-lab.git
    targetRevision: main
    path: charts/cronrack
  destination:
    server: https://kubernetes.default.svc
    namespace: cronrack
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
